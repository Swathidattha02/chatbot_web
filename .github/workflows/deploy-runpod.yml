name: Build and Push Ollama Service to Docker Hub

on:
  push:
    branches: [ "main" ]
    paths:
      - 'fastapi_ollama_service/**'
      - '.github/workflows/deploy-runpod.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi_ollama_service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ollama-fastapi-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # This is where the long build happens (pulling the model)
          # We increase timeout for the build-push-action if needed, 
          # though default is usually fine for a few GBs.
